<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Football Hub | مركز المباريات الشامل</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0612;
            --bg-secondary: #140d24;
            --bg-card: #1f1438;
            --accent-purple: #8b5cf6;
            --accent-glow: #a855f7;
            --accent-light: #c084fc;
            --text-main: #f3e8ff;
            --text-sub: #a78bfa;
            --live-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, #2e1065, #140d24);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.2);
        }

        header h1 {
            font-size: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-btn {
            background: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        .lang-btn:hover {
            background: var(--accent-glow);
        }

        /* Date Navigation Bar */
        .date-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .date-btn {
            background: var(--bg-secondary);
            border: 1px solid rgba(139, 92, 246, 0.2);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
            max-width: 150px;
            text-align: center;
        }

        .date-btn:hover, .date-btn.active {
            background: var(--accent-purple);
            color: #ffffff;
            border-color: var(--accent-glow);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .matches-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* League Header Block */
        .league-block {
            background: var(--bg-secondary);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 14px;
            overflow: hidden;
        }

        .league-header {
            background: rgba(139, 92, 246, 0.15);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            font-weight: bold;
            color: var(--accent-light);
        }

        .league-logo {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        /* Match Card */
        .match-card {
            background: var(--bg-card);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .match-card:last-child {
            border-bottom: none;
        }

        .match-card:hover {
            background: #2a1b4d;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 38%;
        }

        .team.away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .team-name {
            font-size: 14px;
            font-weight: 600;
        }

        .score-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 24%;
        }

        .score {
            font-size: 20px;
            font-weight: 800;
            background: var(--bg-primary);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 4px 14px;
            border-radius: 8px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .status {
            font-size: 11px;
            margin-top: 5px;
            color: var(--text-sub);
            text-align: center;
        }

        .live-tag {
            color: var(--live-red);
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Modal Details Window */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 6, 18, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-purple);
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(139, 92, 246, 0.35);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 22px;
            cursor: pointer;
        }

        [dir="ltr"] .close-btn {
            left: auto;
            right: 15px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }

        .detail-tab {
            margin-top: 15px;
        }

        .detail-title {
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
            padding-bottom: 6px;
            margin: 15px 0 10px 0;
            color: var(--accent-light);
            font-size: 14px;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-trophy" style="color: var(--accent-purple);"></i> <span id="txt-title">مركز المباريات الشامل</span></h1>
        <button class="lang-btn" onclick="toggleLanguage()">
            <i class="fa-solid fa-globe"></i> <span id="txt-lang-btn">English</span>
        </button>
    </header>

    <!-- Date Navigation Bar -->
    <div class="date-bar">
        <button class="date-btn" id="btn-prev" onclick="changeDate(-1)">أمس</button>
        <button class="date-btn active" id="btn-today" onclick="changeDate(0)">اليوم</button>
        <button class="date-btn" id="btn-next" onclick="changeDate(1)">غداً</button>
    </div>

    <div class="matches-container" id="matches">
        <div class="loading" id="txt-loading">جاري تحضير جداول البطولات والمباريات...</div>
    </div>

    <!-- Modal for details -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let currentLang = 'ar';
        let currentDateOffset = 0;
        let groupedMatches = {};

        const i18n = {
            ar: {
                title: "مركز المباريات الشامل",
                langBtn: "English",
                loading: "جاري تحميل وتحديث المباريات...",
                noMatches: "لا توجد مباريات مسجلة في هذا اليوم.",
                error: "حدث خطأ في جلب البيانات.",
                yesterday: "أمس",
                today: "اليوم",
                tomorrow: "غداً",
                venue: "الملعب",
                capacity: "السعة",
                officials: "الحكم",
                statsTitle: "إحصائيات المباراة",
                leadersTitle: "أبرز أحداث وتفاصيل المباراة",
                lineupsTitle: "التشكيلات والمدربين"
            },
            en: {
                title: "Ultimate Match Center",
                langBtn: "عربي",
                loading: "Loading match center data...",
                noMatches: "No matches scheduled for this date.",
                error: "Failed to load data.",
                yesterday: "Yesterday",
                today: "Today",
                tomorrow: "Tomorrow",
                venue: "Venue",
                capacity: "Capacity",
                officials: "Referee",
                statsTitle: "Match Statistics",
                leadersTitle: "Key Events & Leaders",
                lineupsTitle: "Lineups & Managers"
            }
        };

        function getDateFormatted(offset) {
            const d = new Date();
            d.setDate(d.getDate() + offset);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function changeDate(offset) {
            currentDateOffset = offset;
            document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
            if (offset === -1) document.getElementById('btn-prev').classList.add('active');
            if (offset === 0) document.getElementById('btn-today').classList.add('active');
            if (offset === 1) document.getElementById('btn-next').classList.add('active');

            fetchMatches();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            document.getElementById('txt-title').innerText = i18n[currentLang].title;
            document.getElementById('txt-lang-btn').innerText = i18n[currentLang].langBtn;
            document.getElementById('btn-prev').innerText = i18n[currentLang].yesterday;
            document.getElementById('btn-today').innerText = i18n[currentLang].today;
            document.getElementById('btn-next').innerText = i18n[currentLang].tomorrow;

            fetchMatches();
        }

        async function fetchMatches() {
            const container = document.getElementById('matches');
            container.innerHTML = `<div class="loading">${i18n[currentLang].loading}</div>`;

            const dateStr = getDateFormatted(currentDateOffset);
            const langParam = currentLang === 'ar' ? 'ar' : 'en';
            const apiUrl = `https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${dateStr}&lang=${langParam}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const events = data.events || [];

                if (events.length === 0) {
                    container.innerHTML = `<div class="loading">${i18n[currentLang].noMatches}</div>`;
                    return;
                }

                // Group matches by League/Tournament
                groupedMatches = {};
                events.forEach(event => {
                    const leagueName = event.season ? (event.season.slug || 'League') : 'International';
                    const leagueLogo = event.competitions[0].league ? event.competitions[0].league.logos[0]?.href : '';

                    if (!groupedMatches[leagueName]) {
                        groupedMatches[leagueName] = {
                            name: leagueName.toUpperCase().replace(/-/g, ' '),
                            logo: leagueLogo,
                            matches: []
                        };
                    }
                    groupedMatches[leagueName].matches.push(event);
                });

                container.innerHTML = '';

                // Render Leagues and Matches
                Object.keys(groupedMatches).forEach(leagueKey => {
                    const league = groupedMatches[leagueKey];

                    const leagueBlock = document.createElement('div');
                    leagueBlock.className = 'league-block';

                    let matchesHTML = '';
                    league.matches.forEach((event, idx) => {
                        const comp = event.competitions[0];
                        const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
                        const awayTeam = comp.competitors.find(c => c.homeAway === 'away');

                        const isLive = event.status.type.state === 'in';
                        const statusText = isLive ? `<span class="live-tag">● ${event.status.type.detail}</span>` : event.status.type.detail;

                        matchesHTML += `
                            <div class="match-card" onclick="showDetails('${leagueKey}', ${idx})">
                                <div class="team home">
                                    <img class="team-logo" src="${homeTeam.team.logo || 'https://via.placeholder.com/35'}" alt="logo">
                                    <span class="team-name">${homeTeam.team.displayName}</span>
                                </div>
                                <div class="score-info">
                                    <div class="score">${homeTeam.score ?? 0} - ${awayTeam.score ?? 0}</div>
                                    <div class="status">${statusText}</div>
                                </div>
                                <div class="team away">
                                    <span class="team-name">${awayTeam.team.displayName}</span>
                                    <img class="team-logo" src="${awayTeam.team.logo || 'https://via.placeholder.com/35'}" alt="logo">
                                </div>
                            </div>
                        `;
                    });

                    leagueBlock.innerHTML = `
                        <div class="league-header">
                            ${league.logo ? `<img class="league-logo" src="${league.logo}">` : '<i class="fa-solid fa-trophy"></i>'}
                            <span>${league.name}</span>
                        </div>
                        ${matchesHTML}
                    `;

                    container.appendChild(leagueBlock);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="error-msg">${i18n[currentLang].error}</div>`;
            }
        }

        function showDetails(leagueKey, index) {
            const event = groupedMatches[leagueKey].matches[index];
            const comp = event.competitions[0];
            const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
            const awayTeam = comp.competitors.find(c => c.homeAway === 'away');

            const venue = comp.venue ? comp.venue.fullName : 'N/A';
            const capacity = comp.venue && comp.venue.capacity ? comp.venue.capacity.toLocaleString() : 'N/A';
            const official = comp.officials && comp.officials.length > 0 ? comp.officials[0].displayName : 'N/A';
            
            const stats = comp.statistics || [];
            const leaders = comp.leaders || [];

            // Build Statistics List
            let statsHTML = '';
            if (stats.length > 0) {
                stats.forEach(s => {
                    statsHTML += `
                        <div class="stat-row">
                            <span>${s.displayValue || '0'}</span>
                            <span style="color:var(--text-sub); font-weight:600;">${s.label}</span>
                            <span>${s.displayValue || '0'}</span>
                        </div>
                    `;
                });
            } else {
                statsHTML = `<div style="text-align:center; color:var(--text-sub); padding:10px;">لا توجد إحصائيات تفصيلية مسجلة.</div>`;
            }

            // Build Leaders/Events
            let leadersHTML = '';
            if (leaders.length > 0) {
                leaders.forEach(l => {
                    const athlete = l.leaders && l.leaders[0] ? l.leaders[0].athlete.displayName : 'N/A';
                    leadersHTML += `
                        <div class="stat-row">
                            <span style="color:var(--accent-light);">${l.displayName}</span>
                            <span style="font-weight:bold;">${athlete}</span>
                        </div>
                    `;
                });
            } else {
                leadersHTML = `<div style="text-align:center; color:var(--text-sub); padding:10px;">لا توجد تفاصيل أهداف أو أحداث بارزة مسجلة.</div>`;
            }

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div style="text-align:center; margin-bottom:20px;">
                    <h3 style="color:var(--accent-light); margin-bottom:8px;">${groupedMatches[leagueKey].name}</h3>
                    <p style="font-size:12px; color:var(--text-sub);"><i class="fa-solid fa-location-dot"></i> ${i18n[currentLang].venue}: ${venue} (${i18n[currentLang].capacity}: ${capacity})</p>
                    <p style="font-size:12px; color:var(--text-sub); margin-top:3px;"><i class="fa-solid fa-user-ninja"></i> ${i18n[currentLang].officials}: ${official}</p>
                </div>
                
                <div style="display:flex; justify-content:space-around; align-items:center; margin-bottom:20px;">
                    <div style="text-align:center; width:35%;">
                        <img src="${homeTeam.team.logo}" style="width:50px; height:50px; object-fit:contain;">
                        <div style="font-weight:bold; margin-top:6px; font-size:14px;">${homeTeam.team.displayName}</div>
                    </div>
                    <div style="font-size:26px; font-weight:bold; color:var(--accent-glow);">
                        ${homeTeam.score ?? 0} : ${awayTeam.score ?? 0}
                    </div>
                    <div style="text-align:center; width:35%;">
                        <img src="${awayTeam.team.logo}" style="width:50px; height:50px; object-fit:contain;">
                        <div style="font-weight:bold; margin-top:6px; font-size:14px;">${awayTeam.team.displayName}</div>
                    </div>
                </div>

                <div class="detail-tab">
                    <h4 class="detail-title">${i18n[currentLang].statsTitle}</h4>
                    ${statsHTML}
                </div>

                <div class="detail-tab">
                    <h4 class="detail-title">${i18n[currentLang].leadersTitle}</h4>
                    ${leadersHTML}
                </div>
            `;

            document.getElementById('matchModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('matchModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('matchModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Start App and auto refresh every 30 seconds
        fetchMatches();
        setInterval(fetchMatches, 30000);
    </script>
</body>
</html>
