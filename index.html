<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Football Hub | مركز المباريات الشامل</title>
<style>
:root{
  --bg-primary:#0a0612;
  --bg-secondary:#140d24;
  --bg-card:#1f1438;
  --bg-card-2:#26173f;
  --accent-purple:#8b5cf6;
  --accent-glow:#a855f7;
  --accent-light:#c084fc;
  --accent-deep:#5b21b6;
  --text-main:#f3e8ff;
  --text-sub:#a78bfa;
  --text-dim:#7c6a9c;
  --live-red:#ef4444;
  --border-soft:rgba(139,92,246,.22);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg-primary);
  color:var(--text-main);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* ---------- Ambient animated background ---------- */
.bg-field{
  position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
}
.orb{
  position:absolute;border-radius:50%;
  filter:blur(70px);
  opacity:.35;
  background:radial-gradient(circle at 30% 30%, var(--accent-glow), transparent 70%);
  animation:float 22s ease-in-out infinite;
}
.orb.o1{width:420px;height:420px;top:-120px;left:-100px;animation-duration:26s;}
.orb.o2{width:340px;height:340px;bottom:-100px;right:-80px;background:radial-gradient(circle at 60% 40%, var(--accent-deep), transparent 70%);animation-duration:20s;animation-delay:-6s;}
.orb.o3{width:260px;height:260px;top:40%;left:60%;background:radial-gradient(circle at 50% 50%, var(--accent-purple), transparent 70%);animation-duration:30s;animation-delay:-12s;}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(40px,-30px) scale(1.08);}
  66%{transform:translate(-30px,25px) scale(.95);}
}
.grid-lines{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(139,92,246,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,92,246,.05) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse at center, black 0%, transparent 75%);
}

.wrap{
  position:relative;z-index:1;
  max-width:1180px;margin:0 auto;
  padding:22px 18px 70px;
  display:flex;flex-direction:column;gap:18px;
}
@media (min-width:900px){
  .brand h1{font-size:22px;}
  .team-name{font-size:14.5px;}
  .score{font-size:21px;min-width:78px;}
  .match-card{padding:16px 24px;}
  .league-header{padding:14px 20px;}
  .modal-content{max-width:760px;padding:32px;}
}

/* ---------- Header ---------- */
header{
  background:linear-gradient(135deg, rgba(46,16,101,.85), rgba(20,13,36,.9));
  border:1px solid var(--border-soft);
  border-radius:18px;
  padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(139,92,246,.18);
  position:relative;overflow:hidden;
}
header::before{
  content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.08), transparent);
  animation:sheen 6s ease-in-out infinite;
}
@keyframes sheen{
  0%{left:-40%;}
  50%{left:120%;}
  100%{left:120%;}
}
.brand{display:flex;align-items:center;gap:12px;}
.brand h1{font-size:19px;color:#fff;font-weight:800;letter-spacing:.2px;}
.brand .sub-clock{font-size:11px;color:var(--text-sub);margin-top:2px;display:flex;align-items:center;gap:6px;}

.trophy-icon{width:34px;height:34px;flex-shrink:0;}
.trophy-icon .shine{
  transform-origin:center;
  animation:trophyGlow 3s ease-in-out infinite;
}
@keyframes trophyGlow{
  0%,100%{opacity:.5;}
  50%{opacity:1;}
}

.lang-btn{
  background:var(--accent-purple);
  color:#fff;border:none;
  padding:9px 16px;border-radius:10px;
  cursor:pointer;font-weight:700;font-size:13px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 14px rgba(139,92,246,.45);
}
.lang-btn:hover{background:var(--accent-glow);transform:translateY(-1px);}
.globe-icon{width:16px;height:16px;animation:spin 8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* ---------- Date strip ---------- */
.date-strip{
  display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;
  scrollbar-width:none;
}
.date-strip::-webkit-scrollbar{display:none;}
.date-pill{
  flex:0 0 auto;
  min-width:64px;
  background:var(--bg-secondary);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:10px 6px;
  text-align:center;
  cursor:pointer;
  position:relative;
  transition:transform .15s ease, background .2s ease, border-color .2s ease;
}
.date-pill .dow{font-size:10px;color:var(--text-sub);font-weight:600;letter-spacing:.3px;}
.date-pill .dnum{font-size:17px;font-weight:800;color:var(--text-main);margin-top:2px;}
.date-pill .dtag{font-size:9px;color:var(--text-dim);margin-top:2px;height:11px;}
.date-pill:hover{transform:translateY(-2px);border-color:var(--accent-glow);}
.date-pill.active{
  background:linear-gradient(160deg, var(--accent-purple), var(--accent-deep));
  border-color:var(--accent-glow);
  box-shadow:0 6px 18px rgba(139,92,246,.4);
  transform:translateY(-2px);
}
.date-pill.active .dow,.date-pill.active .dnum,.date-pill.active .dtag{color:#fff;}
.date-pill .live-dot-badge{
  position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  width:9px;height:9px;border-radius:50%;
  background:var(--live-red);
  box-shadow:0 0 0 0 rgba(239,68,68,.6);
  animation:pingSmall 1.6s ease-out infinite;
  display:none;
}
.date-pill.has-live .live-dot-badge{display:block;}
@keyframes pingSmall{
  0%{box-shadow:0 0 0 0 rgba(239,68,68,.55);}
  70%{box-shadow:0 0 0 8px rgba(239,68,68,0);}
  100%{box-shadow:0 0 0 0 rgba(239,68,68,0);}
}

/* ---------- Leagues / Matches ---------- */
.matches-container{display:flex;flex-direction:column;gap:16px;}

.league-block{
  background:var(--bg-secondary);
  border:1px solid var(--border-soft);
  border-radius:16px;
  overflow:hidden;
  animation:riseIn .4s ease both;
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

.league-header{
  background:rgba(139,92,246,.13);
  padding:12px 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border-soft);
  cursor:pointer;
  user-select:none;
}
.league-crest-wrap{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;
  background:var(--bg-card);
}
.league-crest-wrap.live-ring::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--live-red);
  animation:ringPulse 1.5s ease-out infinite;
}
@keyframes ringPulse{
  0%{transform:scale(.85);opacity:1;}
  100%{transform:scale(1.4);opacity:0;}
}
.league-logo{width:20px;height:20px;object-fit:contain;border-radius:50%;}
.league-name{font-weight:700;color:var(--accent-light);font-size:14px;flex:1;}
.league-count{
  font-size:11px;color:var(--text-sub);
  background:rgba(139,92,246,.15);
  padding:3px 9px;border-radius:20px;
  border:1px solid var(--border-soft);
}
.chevron{
  width:14px;height:14px;color:var(--text-sub);
  transition:transform .25s ease;
}
.league-block.collapsed .chevron{transform:rotate(-90deg);}
.league-body{
  display:flex;flex-direction:column;
  max-height:2000px;overflow:hidden;
  transition:max-height .35s ease;
}
.league-block.collapsed .league-body{max-height:0;}

.match-card{
  background:var(--bg-card);
  padding:13px 18px;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.035);
  position:relative;
  transition:background .15s ease;
}
.match-card::before{
  content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:transparent;transition:background .2s ease;
}
.match-card.is-live::before{background:var(--live-red);}
.match-card:last-child{border-bottom:none;}
.match-card:hover{background:var(--bg-card-2);}

.team{display:flex;align-items:center;gap:10px;width:37%;min-width:0;}
.team.away{justify-content:flex-end;}
.team-logo{width:32px;height:32px;object-fit:contain;flex-shrink:0;}
.team-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.match-card.is-live .team-name.winning{color:var(--accent-light);}

.score-info{display:flex;flex-direction:column;align-items:center;width:26%;gap:5px;}
.score{
  font-size:19px;font-weight:800;
  background:var(--bg-primary);
  border:1px solid var(--border-soft);
  padding:4px 13px;border-radius:9px;
  color:#fff;letter-spacing:1px;
  min-width:70px;text-align:center;
}
.match-card.is-live .score{border-color:rgba(239,68,68,.5);}
.status-row{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-sub);}
.live-badge{
  display:flex;align-items:center;gap:4px;
  color:var(--live-red);font-weight:800;font-size:10.5px;
}
.radar-dot{position:relative;width:8px;height:8px;}
.radar-dot span{
  position:absolute;inset:0;border-radius:50%;background:var(--live-red);
}
.radar-dot::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--live-red);
  animation:ringPulse 1.2s ease-out infinite;
}
.clock-mini{width:11px;height:11px;color:var(--text-sub);flex-shrink:0;}
.clock-mini .hand{transform-origin:6px 6px;animation:tick 4s steps(4) infinite;}
@keyframes tick{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(10,6,18,.9);
  backdrop-filter:blur(10px);
  display:none;justify-content:center;align-items:center;
  z-index:1000;padding:14px;
}
.modal-content{
  background:var(--bg-secondary);
  border:1px solid var(--accent-purple);
  border-radius:22px;width:100%;max-width:640px;
  padding:26px;max-height:90vh;overflow-y:auto;
  position:relative;
  box-shadow:0 15px 45px rgba(139,92,246,.4);
  animation:modalIn .25s ease;
}
@keyframes modalIn{
  from{opacity:0;transform:scale(.94) translateY(8px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
.close-btn{
  position:absolute;top:14px;left:14px;
  background:rgba(139,92,246,.15);border:1px solid var(--border-soft);
  color:var(--text-sub);width:30px;height:30px;border-radius:50%;
  font-size:18px;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
[dir="ltr"] .close-btn{left:auto;right:14px;}
.close-btn:hover{color:#fff;border-color:var(--accent-glow);}

.modal-league{font-size:12px;color:var(--text-sub);text-align:center;margin-bottom:2px;}
.modal-teams{
  display:flex;justify-content:space-around;align-items:center;
  margin:18px 0 20px;
}
.modal-team{text-align:center;width:34%;}
.modal-team img{width:52px;height:52px;object-fit:contain;}
.modal-team .mt-name{font-weight:700;margin-top:6px;font-size:13.5px;}
.modal-score{
  font-size:28px;font-weight:800;color:var(--accent-glow);
  letter-spacing:1px;
}
.meta-row{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--text-sub);
  justify-content:center;margin-top:4px;
}
.meta-icon{width:12px;height:12px;flex-shrink:0;}
.pin-icon path{animation:bounceY 2s ease-in-out infinite;}
@keyframes bounceY{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}

.detail-title{
  border-bottom:1px solid var(--border-soft);
  padding-bottom:6px;margin:18px 0 12px;
  color:var(--accent-light);font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.star-icon{width:13px;height:13px;animation:twinkle 1.8s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.85);}}

.events-box{
  background:linear-gradient(160deg, rgba(139,92,246,.12), rgba(139,92,246,.03));
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:6px 14px;
}
.event-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.event-row:last-child{border-bottom:none;}
.event-minute{
  font-size:11.5px;font-weight:800;color:var(--accent-light);
  min-width:34px;text-align:center;
  background:rgba(139,92,246,.15);
  border-radius:8px;padding:3px 0;
  flex-shrink:0;
}
.event-icon-svg{width:18px;height:18px;flex-shrink:0;}
.event-icon-svg.goal-spin{animation:rollSpin 3.5s linear infinite;color:var(--accent-light);}
.event-info{flex:1;min-width:0;}
.event-player{font-size:13px;font-weight:700;color:var(--text-main);}
.event-tag{font-size:10.5px;color:var(--accent-light);font-weight:600;}
.event-side{font-size:10.5px;color:var(--text-dim);}

.stat-compare{margin-bottom:12px;}
.stat-labels{
  display:flex;justify-content:space-between;
  font-size:12px;color:var(--text-main);margin-bottom:5px;
}
.stat-bar-track{
  display:flex;align-items:center;gap:6px;height:7px;
}
.stat-bar-track .lbl-center{
  font-size:9.5px;color:var(--text-dim);width:100px;text-align:center;flex-shrink:0;
}
.bar-bg{flex:1;height:7px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;width:0%;transition:width 1s cubic-bezier(.22,1,.36,1);}
.bar-fill.home{background:linear-gradient(90deg,var(--accent-deep),var(--accent-purple));margin-inline-start:auto;}
.bar-fill.away{background:linear-gradient(90deg,var(--accent-glow),var(--accent-light));}

.leader-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);
  font-size:12.5px;
}
.leader-row:last-child{border-bottom:none;}
.leader-label{color:var(--text-sub);display:flex;align-items:center;gap:6px;}
.leader-name{font-weight:700;color:var(--text-main);}

.empty-icon{width:44px;height:44px;margin:0 auto 10px;opacity:.6;}
.ball-icon path{animation:rollSpin 3s linear infinite;transform-origin:center;}
@keyframes rollSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.loading,.error-msg,.empty-msg{text-align:center;padding:50px 20px;color:var(--text-sub);font-size:14px;}
.loading .spinner{
  width:36px;height:36px;margin:0 auto 14px;
  border:3px solid rgba(139,92,246,.2);
  border-top-color:var(--accent-glow);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@media (max-width:480px){
  .brand h1{font-size:16px;}
  .team-name{font-size:12px;}
  .score{font-size:16px;min-width:58px;}
}
</style>
</head>
<body>

<div class="bg-field">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="grid-lines"></div>
</div>

<div class="wrap">

  <header>
    <div class="brand">
      <svg class="trophy-icon" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="trophyGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <path d="M14 6h20v10a10 10 0 0 1-20 0V6z" fill="url(#trophyGrad)"/>
        <path d="M14 8H7a3 3 0 0 0 0 10c0-3 3-5 7-6" stroke="url(#trophyGrad)" stroke-width="2" fill="none"/>
        <path d="M34 8h7a3 3 0 0 1 0 10c0-3-3-5-7-6" stroke="url(#trophyGrad)" stroke-width="2" fill="none"/>
        <rect x="20" y="24" width="8" height="8" fill="url(#trophyGrad)"/>
        <rect x="15" y="34" width="18" height="5" rx="2" fill="url(#trophyGrad)"/>
        <rect class="shine" x="12" y="0" width="6" height="26" fill="#fff" opacity=".5" transform="skewX(-20)"/>
      </svg>
      <div>
        <h1 id="txt-title">مركز المباريات الشامل</h1>
        <div class="sub-clock">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path class="hand" d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="transform-origin:12px 12px;animation:spin 60s linear infinite;"/>
          </svg>
          <span id="live-clock">--:--:--</span>
        </div>
      </div>
    </div>
    <button class="lang-btn" onclick="toggleLanguage()">
      <svg class="globe-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.6"/>
        <path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z" stroke="#fff" stroke-width="1.6"/>
      </svg>
      <span id="txt-lang-btn">English</span>
    </button>
  </header>

  <div class="date-strip" id="dateStrip"></div>

  <div class="matches-container" id="matches">
    <div class="loading" id="initLoading">
      <div class="spinner"></div>
      <span id="txt-loading">جاري تحضير جداول البطولات والمباريات...</span>
    </div>
  </div>

</div>

<div class="modal-overlay" id="matchModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let currentLang = 'ar';
let currentDateOffset = 0;
let groupedMatches = {};
let collapsedLeagues = {};
const DAY_RANGE = 4; // days before/after today shown in strip

// ---------------------------------------------------------------------
// League priority: lower index = shown first.
// Matching is done against MULTIPLE identifiers (id, slug, abbreviation)
// because ESPN's "all" scoreboard doesn't always expose the same field,
// and abbreviation/slug/id stay in English/numeric form even when the
// UI language is Arabic (unlike the league "name", which gets translated
// and therefore can't be used for matching in Arabic mode).
// ---------------------------------------------------------------------
const LEAGUE_PRIORITY = [
  // Continental / international showcase competitions
  'uefa.champions', 'uefa.champions_qual',
  // The "big five" European leagues
  'eng.1', 'esp.1', 'ita.1', 'ger.1', 'fra.1',
  // Other major UEFA club competitions
  'uefa.europa', 'uefa.europa.conf', 'uefa.super_cup',
  // International tournaments
  'fifa.world', 'fifa.worldq.uefa', 'uefa.euro', 'uefa.nations',
  'conmebol.america', 'concacaf.gold', 'afc.asian.cup',
  // Prominent domestic cups of the big five
  'eng.fa', 'eng.league_cup', 'esp.copa_del_rey',
  'ita.coppa_italia', 'ger.dfb_pokal', 'fra.coupe_de_france',
  // Other well-known domestic leagues
  'usa.1', 'ksa.1', 'ned.1', 'por.1', 'tur.1', 'bra.1', 'arg.1',
  // Other continental club competitions
  'conmebol.libertadores', 'conmebol.sudamericana',
  'concacaf.champions', 'afc.champions'
];

// English-language name fallbacks (used only if id/slug/abbreviation are
// all missing from the API response for a given match).
const LEAGUE_NAME_HINTS = [
  'uefa champions league',
  'premier league', 'la liga', 'serie a', 'bundesliga', 'ligue 1',
  'europa league', 'europa conference league',
  'world cup', 'euro championship', 'nations league',
  'copa america', 'gold cup', 'asian cup',
  'fa cup', 'efl cup', 'league cup', 'copa del rey', 'coppa italia', 'dfb', 'coupe de france',
  'mls', 'saudi', 'eredivisie', 'primeira liga', 'super lig',
  'libertadores', 'sudamericana', 'concacaf champions', 'afc champions'
];

function leaguePriorityScore(info){
  const candidates = [info.slug, info.abbreviation, info.id]
    .filter(Boolean)
    .map(v => String(v).toLowerCase());

  for(const c of candidates){
    const idx = LEAGUE_PRIORITY.indexOf(c);
    if(idx !== -1) return idx;
  }

  // fall back to matching the (possibly-translated) display name against
  // English hints - only useful when the API actually returned English text
  const lowerName = (info.name || '').toLowerCase();
  const hintIdx = LEAGUE_NAME_HINTS.findIndex(h => lowerName.includes(h));
  if(hintIdx !== -1) return LEAGUE_PRIORITY.length + hintIdx;

  return -1; // unknown / unmatched league
}

const i18n = {
  ar:{
    title:"مركز المباريات الشامل", langBtn:"English",
    loading:"جاري تحميل وتحديث المباريات...",
    noMatches:"لا توجد مباريات مسجلة في هذا اليوم.",
    error:"حدث خطأ في جلب البيانات. تحقق من الاتصال وحاول مجدداً.",

function t(k){ return i18n[currentLang][k]; }

function getDateObj(offset){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + offset);
  return d;
}
function fmtApiDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}${m}${day}`;
}

/* ---------------- Date strip ---------------- */
function buildDateStrip(){
  const strip = document.getElementById('dateStrip');
  strip.innerHTML = '';
  for(let off=-DAY_RANGE; off<=DAY_RANGE; off++){
    const d = getDateObj(off);
    const pill = document.createElement('div');
    pill.className = 'date-pill' + (off===currentDateOffset ? ' active':'');
    pill.id = 'pill-'+off;
    pill.onclick = () => changeDate(off);
    const dow = t('dows')[d.getDay()];
    const tag = off===0 ? t('today') : '';
    pill.innerHTML = `
      <div class="live-dot-badge"></div>
      <div class="dow">${dow}</div>
      <div class="dnum">${d.getDate()}</div>
      <div class="dtag">${tag}</div>
    `;
    strip.appendChild(pill);
  }
  const active = document.getElementById('pill-'+currentDateOffset);
  if(active) active.scrollIntoView({inline:'center', block:'nearest'});
}

function changeDate(offset){
  currentDateOffset = offset;
  document.querySelectorAll('.date-pill').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('pill-'+offset);
  if(el) el.classList.add('active');
  fetchMatches();
}

  document.getElementById('txt-title').innerText = t('title');

/* ---------------- League name resolution ---------------- */
function resolveLeagueInfo(event){
  const comp = event.competitions[0];
  const league = comp.league || null;
  const seasonSlug = event.season && event.season.slug ? event.season.slug : '';

  let name = (league && league.name) ? league.name : (seasonSlug || 'International');
  name = name.replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
  name = name.replace(/\b\w/g, c => c.toUpperCase());

  const logo = league && league.logos && league.logos.length ? league.logos[0].href : '';
  const slug = (league && league.slug) || seasonSlug || '';
  const abbreviation = league && league.abbreviation ? league.abbreviation : '';
  const id = league && league.id ? league.id : '';

  // Grouping key: prefer the most stable identifier available so the same
  // league doesn't get split into two groups across language switches.
  const key = id || slug || abbreviation || name;

  return {key, id, slug, abbreviation, name, logo};
}

/* ---------------- Fetch & render ---------------- */
async function fetchMatches(){
  const container = document.getElementById('matches');
  container.innerHTML = `<div class="loading"><div class="spinner"></div><span>${t('loading')}</span></div>`;

  const dateStr = fmtApiDate(getDateObj(currentDateOffset));
  const langParam = currentLang === 'ar' ? 'ar' : 'en';
  const apiUrl = `https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${dateStr}&lang=${langParam}`;

  try{
    const response = await fetch(apiUrl);
    const data = await response.json();
    const events = data.events || [];

    if(events.length === 0){
      container.innerHTML = `<div class="empty-msg">${ICON_BALL}<div>${t('noMatches')}</div></div>`;
      markLiveDays();
      return;
    }

    groupedMatches = {};
    events.forEach(event=>{
      const info = resolveLeagueInfo(event);
      if(!groupedMatches[info.key]){
        groupedMatches[info.key] = {
          name: info.name, logo: info.logo,
          slug: info.slug, abbreviation: info.abbreviation, id: info.id,
          matches: []
        };
      }
      groupedMatches[info.key].matches.push(event);
    });

    // sort matches inside each league: live first, then scheduled by time, then finished by time
    Object.values(groupedMatches).forEach(lg=>{
      lg.matches.sort((a,b)=>{
        const rank = ev => ev.status.type.state === 'in' ? 0 : ev.status.type.state === 'pre' ? 1 : 2;
        const ra = rank(a), rb = rank(b);
        if(ra !== rb) return ra - rb;
        return new Date(a.date) - new Date(b.date);
      });
    });

    // sort leagues: known important competitions first (in LEAGUE_PRIORITY
    // order), everything else afterwards sorted alphabetically by name.
    const leagueKeys = Object.keys(groupedMatches).sort((a,b)=>{
      const ra = leaguePriorityScore(groupedMatches[a]);
      const rb = leaguePriorityScore(groupedMatches[b]);
      const scoreA = ra === -1 ? 9999 : ra;
      const scoreB = rb === -1 ? 9999 : rb;
      if(scoreA !== scoreB) return scoreA - scoreB;
      return groupedMatches[a].name.localeCompare(groupedMatches[b].name);
    });

    container.innerHTML = '';
    leagueKeys.forEach(leagueKey=>{
      const league = groupedMatches[leagueKey];
      const hasLive = league.matches.some(e=>e.status.type.state==='in');
      const isCollapsed = !!collapsedLeagues[leagueKey];

      const block = document.createElement('div');
      block.className = 'league-block' + (isCollapsed ? ' collapsed':'');
      block.id = 'lg-'+btoa(unescape(encodeURIComponent(leagueKey))).replace(/[^a-zA-Z0-9]/g,'');

      let matchesHTML = '';
      league.matches.forEach((event, idx)=>{
        const comp = event.competitions[0];
        const homeTeam = comp.competitors.find(c=>c.homeAway==='home');
        const awayTeam = comp.competitors.find(c=>c.homeAway==='away');
        const state = event.status.type.state;
        const isLive = state === 'in';
        const isFinal = state === 'post';

        let statusHTML;
        if(isLive){
          statusHTML = `<div class="live-badge">${ICON_RADAR}<span>${event.status.type.detail || t('live')}</span></div>`;
        } else if(isFinal){
          statusHTML = `<div class="status-row">${t('ft')}</div>`;
        } else {
          statusHTML = `<div class="status-row">${ICON_CLOCK}<span>${localKickoff(event.date)}</span></div>`;
        }

        const hs = homeTeam.score ?? 0, as = awayTeam.score ?? 0;
        const homeWin = isFinal && Number(hs) > Number(as);
        const awayWin = isFinal && Number(as) > Number(hs);

        matchesHTML += `
          <div class="match-card ${isLive?'is-live':''}" onclick="showDetails('${leagueKey.replace(/'/g,"\\'")}', ${idx})">
            <div class="team home">
              <img class="team-logo" src="${homeTeam.team.logo || ''}" alt="" onerror="this.style.visibility='hidden'">
              <span class="team-name ${homeWin?'winning':''}">${homeTeam.team.displayName}</span>
            </div>
            <div class="score-info">
              <div class="score">${state==='pre' ? localKickoff(event.date) : hs+' - '+as}</div>
              ${statusHTML}
            </div>
            <div class="team away">
              <span class="team-name ${awayWin?'winning':''}">${awayTeam.team.displayName}</span>
              <img class="team-logo" src="${awayTeam.team.logo || ''}" alt="" onerror="this.style.visibility='hidden'">
            </div>
          </div>
        `;
      });

      block.innerHTML = `
        <div class="league-header" onclick="toggleLeague('${leagueKey.replace(/'/g,"\\'")}', this)">
          <div class="league-crest-wrap ${hasLive?'live-ring':''}">
            ${league.logo ? `<img class="league-logo" src="${league.logo}" onerror="this.style.display='none'">` : ''}
          </div>
          <span class="league-name">${league.name}</span>
          <span class="league-count">${league.matches.length} ${t('matchesWord')}</span>
          ${ICON_CHEVRON}
        </div>
        <div class="league-body">${matchesHTML}</div>
      `;
      container.appendChild(block);
    });

    markLiveDays();

  }catch(err){
    console.error(err);
    container.innerHTML = `<div class="error-msg">${t('error')}</div>`;
  }
}

function toggleLeague(key, headerEl){
  collapsedLeagues[key] = !collapsedLeagues[key];
  const block = headerEl.closest('.league-block');
  block.classList.toggle('collapsed', collapsedLeagues[key]);
}

  const anyLive = Object.values(groupedMatches).some(lg=>lg.matches.some(e=>e.status.type.state==='in'));
  const pill = document.getElementById('pill-'+currentDateOffset);
  if(pill) pill.classList.toggle('has-live', anyLive);
}

/* ---------------- Modal / details ---------------- */
function buildStatBars(homeTeam, awayTeam){
  const homeStats = homeTeam.statistics || [];
  const awayStats = awayTeam.statistics || [];
  if(homeStats.length === 0 && awayStats.length === 0) return null;

  const map = {};
  homeStats.forEach(s=>{
    map[s.name] = map[s.name] || {};
    map[s.name].label = translateStatLabel(s.name, s.displayName || s.label);
    map[s.name].home = parseFloat(s.displayValue) || 0;
    map[s.name].homeDisplay = s.displayValue ?? '0';
  });
  awayStats.forEach(s=>{
    map[s.name] = map[s.name] || {};
    map[s.name].label = translateStatLabel(s.name, s.displayName || s.label);
    map[s.name].away = parseFloat(s.displayValue) || 0;
    map[s.name].awayDisplay = s.displayValue ?? '0';
  });

  let html = '';
  Object.values(map).forEach(row=>{
    const h = row.home || 0, a = row.away || 0;
    const total = h + a;
    const homePct = total > 0 ? (h/total*100) : 50;
    const awayPct = total > 0 ? (a/total*100) : 50;
    html += `
      <div class="stat-compare">
        <div class="stat-labels">
          <span>${row.homeDisplay ?? '0'}</span>
          <span style="color:var(--text-sub);font-weight:600;">${row.label}</span>
          <span>${row.awayDisplay ?? '0'}</span>
        </div>
        <div class="stat-bar-track">
          <div class="bar-bg"><div class="bar-fill home" data-pct="${homePct}" style="width:0%"></div></div>
          <div class="bar-bg"><div class="bar-fill away" data-pct="${awayPct}" style="width:0%"></div></div>
        </div>
      </div>
    `;
  });
  return html;
}

function clockMinutes(clock){
  if(!clock) return 999;
  const raw = (clock.displayValue || clock || '').toString();
  const m = raw.match(/(\d+)(?:\+(\d+))?/);
  if(!m) return 999;
  return parseInt(m[1],10) + (m[2]?parseInt(m[2],10)*0.1:0);
}

function goalTag(detail){
  const text = ((detail.type && detail.type.text) || '').toLowerCase();
  if(detail.penaltyKick || text.includes('penalty')) return t('tagPenalty');
  if(text.includes('free kick')) return t('tagFreeKick');
  if(detail.ownGoal || text.includes('own goal')) return t('tagOwnGoal');
  if(text.includes('header')) return t('tagHeader');
  return '';
}

function buildEventsTimeline(comp, homeTeam, awayTeam){
  const details = comp.details || [];
  if(details.length === 0) return null;

  const relevant = details.filter(d=>{
    const text = ((d.type && d.type.text) || '').toLowerCase();
    return d.scoringPlay || d.yellowCard || d.redCard || text.includes('goal') || text.includes('card') || text.includes('substitution');
  });
  if(relevant.length === 0) return null;

  relevant.sort((a,b)=> clockMinutes(a.clock) - clockMinutes(b.clock));

  let html = '';
  relevant.forEach(d=>{
    const text = ((d.type && d.type.text) || '').toLowerCase();
    const teamId = d.team && d.team.id;
    const isHome = teamId && homeTeam.team && teamId === homeTeam.team.id;
    const isAway = teamId && awayTeam.team && teamId === awayTeam.team.id;
    const sideLabel = isHome ? homeTeam.team.displayName : isAway ? awayTeam.team.displayName : '';

    let icon, playerName, tagText = '';
    if(d.scoringPlay || text.includes('goal')){
      icon = ICON_GOAL;
      playerName = (d.athletesInvolved && d.athletesInvolved[0] && (d.athletesInvolved[0].displayName || d.athletesInvolved[0].shortName)) || (d.text || '');
      tagText = goalTag(d);
    } else if(d.redCard || text.includes('red card')){
      icon = ICON_RED;
      playerName = (d.athletesInvolved && d.athletesInvolved[0] && (d.athletesInvolved[0].displayName || d.athletesInvolved[0].shortName)) || (d.text || '');
    } else if(d.yellowCard || text.includes('yellow card')){
      icon = ICON_YELLOW;
      playerName = (d.athletesInvolved && d.athletesInvolved[0] && (d.athletesInvolved[0].displayName || d.athletesInvolved[0].shortName)) || (d.text || '');
    } else if(text.includes('substitution')){
      icon = ICON_SUB;
      const inP = d.athletesInvolved && d.athletesInvolved[0] ? (d.athletesInvolved[0].displayName || d.athletesInvolved[0].shortName) : '';
      const outP = d.athletesInvolved && d.athletesInvolved[1] ? (d.athletesInvolved[1].displayName || d.athletesInvolved[1].shortName) : '';
      playerName = outP ? `${t('subIn')} ${inP} · ${t('subOut')} ${outP}` : (inP || d.text || '');
    } else {
      return;
    }
    if(!playerName) return;

    const clockText = (d.clock && d.clock.displayValue) || '';
    html += `
      <div class="event-row">
        <div class="event-minute">${clockText}</div>
        ${icon}
        <div class="event-info">
          <div class="event-player">${playerName}${tagText?` <span class="event-tag">(${tagText})</span>`:''}</div>
          ${sideLabel?`<div class="event-side">${sideLabel}</div>`:''}
        </div>
      </div>
    `;
  });

  return html || null;
}

function showDetails(leagueKey, index){
  const event = groupedMatches[leagueKey].matches[index];
  const comp = event.competitions[0];
  const homeTeam = comp.competitors.find(c=>c.homeAway==='home');
  const awayTeam = comp.competitors.find(c=>c.homeAway==='away');

  const venue = comp.venue ? comp.venue.fullName : 'N/A';
  const capacity = comp.venue && comp.venue.capacity ? comp.venue.capacity.toLocaleString() : null;
  const official = comp.officials && comp.officials.length > 0 ? comp.officials[0].displayName : null;

  const leaders = comp.leaders || event.competitions[0].leaders || [];
  let performersHTML = '';
  if(leaders.length > 0){
    leaders.forEach(l=>{
      const athlete = l.leaders && l.leaders[0] ? l.leaders[0].athlete.displayName : null;
      const value = l.leaders && l.leaders[0] ? l.leaders[0].displayValue : '';
      if(!athlete) return;
      performersHTML += `
        <div class="leader-row">
          <span class="leader-label">${ICON_STAR}${l.displayName}</span>
          <span class="leader-name">${athlete} ${value?('· '+value):''}</span>
        </div>
      `;
    });
  }

  const eventsHTML = buildEventsTimeline(comp, homeTeam, awayTeam);
  const eventsBlock = eventsHTML ? eventsHTML : `<div class="empty-msg" style="padding:16px;">${t('noEvents')}</div>`;

  const statsHTML = buildStatBars(homeTeam, awayTeam);
  const statsBlock = statsHTML ? statsHTML : `<div class="empty-msg" style="padding:16px;">${t('noStats')}</div>`;

  const hs = homeTeam.score ?? 0, as = awayTeam.score ?? 0;
  const isPre = event.status.type.state === 'pre';
  const scoreDisplay = isPre ? localKickoff(event.date) : `${hs} : ${as}`;

  const modalBody = document.getElementById('modalBody');
  modalBody.innerHTML = `
    <div class="modal-league">${groupedMatches[leagueKey].name}</div>
    <div class="meta-row">${ICON_PIN}<span>${t('venue')}: ${venue}${capacity?` (${t('capacity')}: ${capacity})`:''}</span></div>
    ${official?`<div class="meta-row">${ICON_WHISTLE}<span>${t('officials')}: ${official}</span></div>`:''}

    <div class="modal-teams">
      <div class="modal-team">
        <img src="${homeTeam.team.logo||''}" onerror="this.style.visibility='hidden'">
        <div class="mt-name">${homeTeam.team.displayName}</div>
      </div>
      <div class="modal-score">${scoreDisplay}</div>
      <div class="modal-team">
        <img src="${awayTeam.team.logo||''}" onerror="this.style.visibility='hidden'">
        <div class="mt-name">${awayTeam.team.displayName}</div>
      </div>
    </div>

    <div class="detail-tab">
      <h4 class="detail-title">${ICON_STAR}${t('eventsTitle')}</h4>
      <div class="events-box">${eventsBlock}</div>
    </div>

    <div class="detail-tab">
      <h4 class="detail-title">${ICON_STAR}${t('statsTitle')}</h4>
      ${statsBlock}
    </div>

    ${performersHTML ? `
    <div class="detail-tab">
      <h4 class="detail-title">${ICON_STAR}${t('performersTitle')}</h4>
      ${performersHTML}
    </div>` : ''}
  `;

  document.getElementById('matchModal').style.display = 'flex';
  // animate bars after paint
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll('.bar-fill').forEach(el=>{
        el.style.width = el.dataset.pct + '%';
      });
    });
  });
}

function closeModal(){
  document.getElementById('matchModal').style.display = 'none';
}
window.onclick = function(event){
  const modal = document.getElementById('matchModal');
  if(event.target == modal) closeModal();
};

/* ---------------- Init ---------------- */
buildDateStrip();
fetchMatches();
setInterval(fetchMatches, 30000);
</script>
</body>
</html>
